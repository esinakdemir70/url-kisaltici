<!DOCTYPE html>
<html lang="tr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>URL Kısaltıcı</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #f3f4f6;
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			color: #1f2937;
		}
		main {
			width: 100%;
			max-width: 520px;
			margin: 16px;
			padding: 32px;
			background: #fff;
			border-radius: 12px;
			box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
		}
		h1 { margin: 0 0 4px; font-size: 1.6rem; }
		.aciklama { margin: 0 0 24px; color: #6b7280; }
		label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
		.istege-bagli { font-weight: 400; color: #6b7280; }
		input {
			width: 100%;
			padding: 10px 12px;
			margin-bottom: 16px;
			border: 1px solid #d1d5db;
			border-radius: 8px;
			font-size: 1rem;
		}
		input:focus { outline: 2px solid #2563eb; border-color: #2563eb; }
		button {
			padding: 10px 18px;
			border: none;
			border-radius: 8px;
			background: #2563eb;
			color: #fff;
			font-size: 1rem;
			font-weight: 600;
			cursor: pointer;
		}
		button:hover { background: #1d4ed8; }
		button:disabled { background: #93c5fd; cursor: wait; }
		#kisalt-butonu { width: 100%; }
		.kutu { margin-top: 20px; padding: 14px; border-radius: 8px; }
		.sonuc { background: #ecfdf5; border: 1px solid #a7f3d0; }
		.hata { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
		.sonuc-satiri { display: flex; gap: 8px; align-items: center; }
		.sonuc-satiri a { flex: 1; font-weight: 600; color: #047857; word-break: break-all; }
		.orijinal { margin: 8px 0 0; font-size: 0.85rem; color: #6b7280; word-break: break-all; }
		[hidden] { display: none; }
	</style>
</head>
<body>
	<main>
		<h1>URL Kısaltıcı</h1>
		<p class="aciklama">Uzun bir bağlantıyı yapıştırın, kısa ve paylaşılabilir hâlini alın.</p>

		<form id="url-formu">
			<label for="url">Kısaltılacak bağlantı</label>
			<input id="url" name="url" type="text" placeholder="https://www.ornek.com/cok/uzun/adres" autocomplete="off" required>

			<label for="ozel-kod">Özel kod <span class="istege-bagli">(isteğe bağlı)</span></label>
			<input id="ozel-kod" name="ozelKod" type="text" placeholder="ör. devops-odev" autocomplete="off">

			<button id="kisalt-butonu" type="submit">Kısalt</button>
		</form>

		<div id="sonuc" class="kutu sonuc" hidden>
			<div class="sonuc-satiri">
				<a id="kisa-link" href="#" target="_blank" rel="noopener"></a>
				<button id="kopyala-butonu" type="button">Kopyala</button>
			</div>
			<p class="orijinal">Asıl adres: <span id="orijinal-url"></span></p>
		</div>

		<div id="hata" class="kutu hata" role="alert" hidden></div>
	</main>

	<script>
		const form = document.getElementById("url-formu");
		const buton = document.getElementById("kisalt-butonu");
		const sonucKutusu = document.getElementById("sonuc");
		const kisaLink = document.getElementById("kisa-link");
		const orijinalUrl = document.getElementById("orijinal-url");
		const hataKutusu = document.getElementById("hata");

		form.addEventListener("submit", async (olay) => {
			olay.preventDefault(); // Sayfanın yenilenmesini engeller.
			sonucKutusu.hidden = true;
			hataKutusu.hidden = true;

			const istek = { url: form.url.value.trim() };
			const ozelKod = form.ozelKod.value.trim();
			if (ozelKod !== "") {
				istek.ozelKod = ozelKod; // Boşsa hiç gönderilmez, sunucu rastgele kod üretir.
			}

			buton.disabled = true;
			buton.textContent = "Kısaltılıyor...";
			try {
				const yanit = await fetch("/api/kisalt", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify(istek)
				});
				const veri = await yanit.json();

				if (yanit.ok) {
					kisaLink.textContent = veri.kisaUrl;
					kisaLink.href = veri.kisaUrl;
					orijinalUrl.textContent = veri.orijinalUrl;
					sonucKutusu.hidden = false;
				} else {
					hataGoster(veri.hata || "Bir hata oluştu.");
				}
			} catch (hata) {
				hataGoster("Sunucuya ulaşılamadı. Uygulamanın çalıştığından emin olun.");
			} finally {
				buton.disabled = false;
				buton.textContent = "Kısalt";
			}
		});

		const kopyalaButonu = document.getElementById("kopyala-butonu");
		kopyalaButonu.addEventListener("click", async () => {
			try {
				await navigator.clipboard.writeText(kisaLink.href);
				kopyalaButonu.textContent = "Kopyalandı";
			} catch (hata) {
				kopyalaButonu.textContent = "Kopyalanamadı";
			}
			setTimeout(() => { kopyalaButonu.textContent = "Kopyala"; }, 1500);
		});

		function hataGoster(mesaj) {
			hataKutusu.textContent = mesaj;
			hataKutusu.hidden = false;
		}
	</script>
</body>
</html>
